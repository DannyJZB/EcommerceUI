name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - '**'           # build en cualquier rama
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Develop        # PRs que apuntan a develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Archive build
        run: |
          mkdir -p artifact
          cp -r dist/EcommerceUI/browser/* artifact/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: swa-build
          path: artifact

  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    # Solo para pushes a develop (la rama ligada en Azure)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swa-build
          path: artifact

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core')
            return await core.getIDToken()
          result-encoding: string

      - name: Deploy to Static Web Apps (PROD)
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_SAND_0813E1910 }}
          skip_app_build: true
          app_location: "artifact"      # subimos lo ya compilado
          output_location: ""
          api_location: ""
          github_id_token: ${{ steps.idtoken.outputs.result }}

  deploy_preview:
    needs: build
    runs-on: ubuntu-latest
    # Solo en PRs abiertos/sync/reopen cuyo destino es develop
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'develop'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swa-build
          path: artifact

      - name: Deploy to Static Web Apps (PREVIEW)
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          # Para previews basta el token del repo; el servicio crea un entorno temporal
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_SAND_0813E1910 }}
          skip_app_build: true
          app_location: "artifact"
          output_location: ""
          api_location: ""
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  close_preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref == 'develop'
    steps:
      - name: Close PR Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
          repo_token: ${{ secrets.GITHUB_TOKEN }}
